name: Windows x64 build
on:
  workflow_dispatch:
  pull_request:

env:
  AVALONIA_TELEMETRY_OPTOUT: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: 扫描已跟踪的公开源码快照
        shell: pwsh
        run: |
          $snapshot = Join-Path $env:RUNNER_TEMP 'xg-public-source'
          $archive = Join-Path $env:RUNNER_TEMP 'xg-public-source.zip'
          git archive --format=zip --output=$archive HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Failed to export tracked source.' }
          Expand-Archive -LiteralPath $archive -DestinationPath $snapshot -Force
          python "$snapshot/scripts/scan-public-source.py" $snapshot --report "$env:RUNNER_TEMP/xg-public-scan.json" --strict-layout
      - name: 许可证与安全扫描回归
        run: python -m unittest discover -s tests -p '*tests.py' -v
      - run: dotnet restore XG-Launcher.sln --locked-mode
      - run: dotnet build XG-Launcher.sln -c Release --no-restore
      - name: 执行核心与无头UI测试
        run: dotnet test XG-Launcher.sln -c Release --no-build --no-restore
      - name: 校验XML文档
        run: dotnet build XG-Launcher.sln -c Release --no-restore -p:GenerateDocumentationFile=true -p:NoWarn=1591 -warnaserror
      - shell: pwsh
        run: ./build-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: XGLauncher-win-x64
          path: |
            dist/win-x64/XG-Launcher/XGLauncher.exe
          if-no-files-found: error
