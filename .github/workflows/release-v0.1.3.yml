name: Release XG Launcher v0.1.3
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/release-v0.1.3.yml]

permissions:
  contents: read

env:
  AVALONIA_TELEMETRY_OPTOUT: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  build:
    if: github.repository == 'Zc345370669/XG-Launcher' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Verify source and run regressions
        run: |
          grep -Fq '<Version>0.1.3</Version>' Directory.Build.props
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          mkdir -p "$RUNNER_TEMP/source"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/source"
          python3 scripts/scan-public-source.py "$RUNNER_TEMP/source" --report "$RUNNER_TEMP/source-scan.json" --strict-layout
          python3 -m unittest discover -s tests -p '*tests.py'
          dotnet restore -m:1 --locked-mode
          dotnet build -c Release -m:1 --no-restore
          dotnet test -c Release -m:1 --no-restore
      - name: Build and verify the Windows x64 release
        run: |
          bash scripts/publish-portable-windows.sh "$RUNNER_TEMP/release"
          cd "$RUNNER_TEMP/release"
          python3 "$GITHUB_WORKSPACE/scripts/verify-bundle.py" XG-Launcher/XGLauncher.exe \
            "$GITHUB_WORKSPACE/src/XGLauncher/bin/Release/net10.0/win-x64/XGLauncher.dll" \
            "$GITHUB_WORKSPACE/src/XG.Core/bin/Release/net10.0/XG.Core.dll"
          mkdir -p assets legacy/tools
          cp XG-Launcher/XGLauncher.exe assets/
          cp assets/XGLauncher.exe "$GITHUB_WORKSPACE/LICENSE" legacy/
          cp "$GITHUB_WORKSPACE/src/XGLauncher/obj/single-exe-assets/updater/XGUpdater.exe" legacy/tools/
          (cd legacy && zip -q -0 ../assets/XGLauncher-portable-win-x64.zip XGLauncher.exe LICENSE tools/XGUpdater.exe)
          (cd assets && sha256sum XGLauncher.exe XGLauncher-portable-win-x64.zip > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: v0.1.3-windows-x64
          path: ${{ runner.temp }}/release/assets/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    concurrency: release-v0.1.3
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: v0.1.3-windows-x64
          path: release
      - name: Archive the previous source and publish v0.1.3
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq .object.sha)" = "$GITHUB_SHA"
          archive_sha=$(git rev-parse HEAD^)
          git show "$archive_sha:Directory.Build.props" | grep -F '<Version>0.1.2</Version>'
          if archive_tip=$(gh api "repos/$GH_REPO/git/ref/tags/v0.1.2" --jq .object.sha 2>/dev/null); then
            test "$archive_tip" = "$archive_sha"
          else
            gh api --method POST "repos/$GH_REPO/git/refs" -f ref=refs/tags/v0.1.2 -f sha="$archive_sha"
          fi
          (cd release && sha256sum -c SHA256SUMS.txt)
          if gh release view v0.1.3 >/dev/null 2>&1; then
            test "$(gh release view v0.1.3 --json isDraft,targetCommitish --jq .isDraft)" = true
            test "$(gh release view v0.1.3 --json targetCommitish --jq .targetCommitish)" = "$GITHUB_SHA"
            gh release upload v0.1.3 release/XGLauncher.exe release/XGLauncher-portable-win-x64.zip release/SHA256SUMS.txt --clobber
          else
            gh release create v0.1.3 release/XGLauncher.exe release/XGLauncher-portable-win-x64.zip release/SHA256SUMS.txt \
              --draft --target "$GITHUB_SHA" --title 'XG Launcher v0.1.3' --notes-file CHANGELOG_v0.1.3.md
          fi
          test "$(gh release view v0.1.3 --json assets --jq '.assets | length')" = 3
          gh release edit v0.1.3 --draft=false --latest
          test "$(gh api "repos/$GH_REPO/git/ref/tags/v0.1.3" --jq .object.sha)" = "$GITHUB_SHA"
