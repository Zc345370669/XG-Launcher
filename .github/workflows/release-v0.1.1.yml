name: Release XG Launcher v0.1.1
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [RELEASE_NOTES.md]
permissions:
  contents: read
env:
  AVALONIA_TELEMETRY_OPTOUT: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
jobs:
  build:
    if: github.repository == 'Zc345370669/XG-Launcher' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Verify public source and run tests
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          mkdir -p "$RUNNER_TEMP/source"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/source"
          python scripts/scan-public-source.py "$RUNNER_TEMP/source" --report "$RUNNER_TEMP/source-scan.json" --strict-layout
          python -m unittest discover -s tests -p '*tests.py'
          dotnet test -c Release -m:1
      - name: Build Windows x64 executable
        run: bash scripts/publish-portable-windows.sh "$RUNNER_TEMP/release"
      - uses: actions/upload-artifact@v4
        with:
          name: release-win-x64
          path: ${{ runner.temp }}/release/XG-Launcher/XGLauncher.exe
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    concurrency: release-v0.1.1
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: release-win-x64
          path: release
      - name: Publish v0.1.1
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '<Version>0.1.1</Version>' Directory.Build.props || exit 0
          if gh release view v0.1.1 >/dev/null 2>&1; then
            gh release view v0.1.1 --json isDraft,assets --jq 'select(.isDraft == false) | .assets[] | select(.name == "XGLauncher.exe") | .name' | grep -Fxq XGLauncher.exe
            exit 0
          fi
          if ! gh release view v0.1.0-alpha >/dev/null 2>&1; then
            gh release create v0.1.0-alpha --target 9f51dea95d4fcc9bf10ce3045e2ade02cf14fe30 \
              --title 'XG Launcher v0.1.0-alpha（历史版本）' \
              --notes-file docs/history/v0.1.0-alpha.md --prerelease --latest=false
          fi
          test -s release/XGLauncher.exe
          (cd release && sha256sum XGLauncher.exe > SHA256SUMS.txt)
          gh release create v0.1.1 release/XGLauncher.exe release/SHA256SUMS.txt \
            --target "$GITHUB_SHA" --title 'XG Launcher v0.1.1' --notes-file RELEASE_NOTES.md --latest
